<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PromiseLedger — a register of kept and broken promises</title>
    <meta name="description" content="File a public promise, point it at the evidence that will prove it, and let GenLayer validators keep re-checking it. Verdicts carry a verbatim quote and the hash of the page they came from." />
    <meta name="theme-color" content="#f4f0e4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PromiseLedger — a register of kept and broken promises" />
    <meta property="og:description" content="Public promises, judged against evidence by GenLayer validators. No quote, no verdict." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("pl2:theme");
        if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>PromiseLedger needs JavaScript to read the chain.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
